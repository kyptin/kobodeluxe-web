<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kobo Deluxe</title>
<style>
  :root { color-scheme: dark; --bg:#0b0d12; --fg:#d7dbe6; --dim:#8a91a3; --acc:#4fb3ff; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font:14px/1.4 system-ui, sans-serif; overflow:hidden; }
  #app { height:100%; display:flex; flex-direction:column; align-items:center; padding:12px 16px; gap:10px; }
  #stage { position:relative; flex:1 1 0; min-height:0; width:100%; display:flex; align-items:center; justify-content:center; }
  #wrap { position:relative; aspect-ratio:4/3; max-width:100%; max-height:100%; height:100%; }
  @supports not (aspect-ratio: 4/3) { #wrap { width:640px; height:480px; } }
  #canvas { display:block; width:100%; height:100%; background:#000; image-rendering:pixelated;
    image-rendering:crisp-edges; outline:none; border:1px solid #222836; }
  #overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; background:rgba(5,7,10,.92); cursor:pointer; text-align:center; padding:16px; }
  #overlay h1 { margin:0; font-size:clamp(20px,5vw,34px); letter-spacing:.04em; }
  #play { font-size:20px; color:var(--acc); opacity:.4; }
  #play.ready { opacity:1; animation:pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity:.5; } }
  #prog { width:min(320px,70%); height:8px; background:#1a1f2b; border-radius:4px; overflow:hidden; }
  #bar { height:100%; width:0; background:var(--acc); transition:width .15s; }
  #status { color:var(--dim); font-size:12px; min-height:1.4em; }
  #bottom { flex:none; display:flex; flex-wrap:wrap; gap:6px 16px; align-items:center; justify-content:center; color:var(--dim); font-size:12px; text-align:center; }
  button { background:#1a1f2b; color:var(--fg); border:1px solid #2c3446; border-radius:6px; padding:5px 12px; font:inherit; cursor:pointer; }
  button:hover { border-color:var(--acc); }
  a { color:var(--acc); }
  kbd { background:#1a1f2b; border:1px solid #2c3446; border-radius:3px; padding:0 4px; color:var(--fg); }
</style>
</head>
<body>
<div id="app">
  <div id="stage"><div id="wrap">
    <canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
    <div id="overlay">
      <h1>Kobo Deluxe</h1>
      <div id="prog"><div id="bar"></div></div>
      <div id="status">Loading...</div>
      <div id="play">Loading...</div>
    </div>
  </div></div>
  <div id="bottom">
    <span><kbd>Arrows</kbd>/<kbd>Numpad</kbd> move &middot; <kbd>Ctrl</kbd>/<kbd>Shift</kbd> fire &middot; <kbd>Space</kbd>/<kbd>Enter</kbd> start &middot; <kbd>Esc</kbd> menu &middot; <kbd>P</kbd> pause</span>
    <button id="fs" type="button">Fullscreen</button>
  </div>
  <div id="bottom2" class="credits" style="flex:none;color:var(--dim);font-size:12px;text-align:center">
    Kobo Deluxe by David Olofson, based on XKobo by Akira Higuchi. Unofficial web port.
    <a href="SOURCE_URL">Source code (GPL)</a>
  </div>
</div>
<script>
(function () {
  var overlay = document.getElementById('overlay'), play = document.getElementById('play');
  var ready = false;
  window.koboLoaded = function () {
    if (ready) return; ready = true;
    document.getElementById('prog').style.display = 'none';
    document.getElementById('status').style.display = 'none';
    play.textContent = 'Click to play'; play.classList.add('ready');
  };
  function go() {
    if (!ready) return;
    overlay.style.display = 'none';
    window.koboStart();
  }
  overlay.addEventListener('click', go);
  window.addEventListener('keydown', function (e) {
    if (!ready || overlay.style.display === 'none') return;
    if (e.key === 'F5' || e.key === 'F12' || e.metaKey) return;
    e.preventDefault(); go();
  });
  // Keep game keys from scrolling the page.
  var block = {37:1,38:1,39:1,40:1,32:1,33:1,34:1,35:1,36:1,9:1,8:1};
  window.addEventListener('keydown', function (e) { if (block[e.keyCode]) e.preventDefault(); }, {passive:false});
  document.getElementById('canvas').addEventListener('mousedown', function () { this.focus(); });
  document.getElementById('fs').addEventListener('click', function () {
    var w = document.getElementById('wrap');
    (w.requestFullscreen || w.webkitRequestFullscreen).call(w);
    document.getElementById('canvas').focus();
  });
  window.addEventListener('error', function (e) { document.getElementById('status').textContent = 'Error: ' + e.message; });
})();
</script>
{{{ SCRIPT }}}
</body>
</html>
